services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../runtime.env
    environment:
      PUBLIC_DEMO: "1"
      CLOUD_ALLOW_TRAINING: "1"
      DEMO_LOGIN: "1"
      DEMO_PASSWORD_REQUIRED: "0"
      PUBLIC_DAILY_LIMIT: "60"
    volumes:
      - ../weights:/app/weights:ro
      - ../results:/app/results
      - ../data:/app/data:ro
    mem_limit: 3g
    memswap_limit: 4g
    cpus: 2
    pids_limit: 128
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  proxy:
    image: caddy:2
    restart: unless-stopped
    env_file: ../runtime.env
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:18000:8081"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
